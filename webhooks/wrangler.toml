# Two fully separate deployments: different Worker, database, secret and
# Discord channel. Nothing is shared, so a sandbox mistake can't touch production.
#
# Secrets are never in this file. Set them per environment:
#   npx wrangler secret put GITHUB_WEBHOOK_SECRET --env sandbox
#   npx wrangler secret put DISCORD_WEBHOOK_URL   --env sandbox
# (then the same two with --env production, using different values)

name = "br-hooks"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true
observability = { enabled = true }

[env.sandbox]
name = "br-hooks-sandbox"
vars = { ENV_NAME = "sandbox", ALLOWED_REPO = "johnbmurdock3/battle-rhythm-sandbox", STORE_BODIES = "1" }
d1_databases = [
  { binding = "DB", database_name = "br-hooks-sandbox", database_id = "REPLACE_WITH_SANDBOX_DATABASE_ID" }
]

[env.production]
name = "br-hooks-production"
vars = { ENV_NAME = "production", ALLOWED_REPO = "johnbmurdock3/battle-rhythm", STORE_BODIES = "0" }
d1_databases = [
  { binding = "DB", database_name = "br-hooks-production", database_id = "REPLACE_WITH_PRODUCTION_DATABASE_ID" }
]
